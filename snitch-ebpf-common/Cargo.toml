[package]
name = "snitch-ebpf-common"
description = "Types shared between snitch's BPF programs and the userspace loader"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Userspace side: aya::Pod impls for map keys.
user = ["dep:aya"]

[dependencies]
aya = { version = "=0.14.0", default-features = false, optional = true }
