[package]
name = "snitch"
description = "Intrusion detection and file integrity verification"
version = "0.1.9"
edition = "2021"
license = "MIT"
readme = "README.md"
authors = ["Marius Kriegerowski <marius.kriegerowski@gmail.com>"]

[lib]
name = "snitch"
path = "src/lib.rs"

[[bin]]
name = "snitch"
path = "src/bin.rs"

[dependencies]
chatterbox = "2.0"
clap = {version= "4.1.13", features=["derive"]}
data-encoding = "2.3"
env_logger = "0.11.8"
indicatif = "0.17.11"
lazy_static = "1"
log = "0.4"
regex = "1.5"
ring = "0.17.0-alpha.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.19"
sled = "0.34"
tokio = { version = "1.17", features = ["full"] }
walkdir = "2.3"
notify = { version = "8.0" , features = ["serde"]}
eyre = "0.6.8"
thiserror = "1.0.40"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = {version =  "0.4.41", features = ["serde"] }
hostname = "^0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# aya 0.14: newest release that builds with Rust 1.94 (Yocto wrynose);
# aya 0.15+ needs 1.98.
aya = { version = "=0.14.0", default-features = false, optional = true }
sd-notify = { version = "0.5.0", features = ["fdstore"], optional = true }
snitch-ebpf-common = { path = "snitch-ebpf-common", features = ["user"], optional = true }
snitch-ebpf-loader = { path = "snitch-ebpf-loader", optional = true }

[dev-dependencies]
needs_env_var = "1.1.0"

[features]
experimental = []
# `snitch --watch-ebpf`: BPF LSM file monitoring (Linux >= 5.7 with
# CONFIG_BPF_LSM, "bpf" in the active LSMs, and kernel BTF). See
# snitch-ebpf-loader/build.rs for how the BPF object is built.
ebpf = ["dep:aya", "dep:snitch-ebpf-common", "dep:snitch-ebpf-loader", "dep:sd-notify"]

[workspace]
members = [".", "snitch-ebpf-common", "snitch-ebpf-loader"]
# Built for the BPF target by snitch-ebpf-loader/build.rs (or by Yocto), not
# with the workspace.
exclude = ["snitch-ebpf"]
resolver = "3"
